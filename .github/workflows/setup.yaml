name: Test setup action
on: push

jobs:

  latest:
    strategy:
      matrix:
        runs-on:
          - ubuntu-latest
          - ubuntu-slim
          - ubuntu-26.04-arm
          - macos-latest
          - macos-26-intel
          - windows-latest
      fail-fast: false
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./setup
      - name: sver calc
        shell: bash
        run: sver calc

  version:
    strategy:
      matrix:
        job:
          - os: linux
            runs-on: ubuntu-latest
          - os: macos
            runs-on: macos-latest
          - os: windows
            runs-on: windows-latest
        version:
          - v0.1.14
          - v0.1.20
      fail-fast: false
    runs-on: ${{ matrix.job.runs-on }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./setup
        with:
          version: ${{ matrix.version }}
          os: ${{ matrix.job.os }}
      - name: check version
        shell: bash
        run: test "$(sver --version)" == "${version/#v/sver }"
        env:
          version: ${{ matrix.version }}
      - name: sver calc
        shell: bash
        run: sver calc
